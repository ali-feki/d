<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate JS Deobfuscator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify.min.js"></script>
    <style>
        :root { --bg-color: #0d1117; --panel-bg: #161b22; --border-color: #30363d; --text-main: #c9d1d9; --text-muted: #8b949e; --accent: #58a6ff; --btn-primary: #238636; --btn-primary-hover: #2ea043; --danger: #f85149; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background-color: var(--panel-bg); padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        header h1 span { color: var(--accent); }
        .container { display: flex; flex: 1; padding: 15px; gap: 15px; overflow: hidden; }
        .panel { flex: 1; background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
        .panel-header { padding: 10px 15px; border-bottom: 1px solid var(--border-color); font-size: 13px; font-weight: 600; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; background-color: #21262d; }
        textarea { flex: 1; width: 100%; background-color: transparent; color: #79c0ff; border: none; padding: 15px; font-family: 'Courier New', Courier, monospace; font-size: 14px; line-height: 1.5; resize: none; outline: none; }
        textarea::placeholder { color: #484f58; }
        .controls { padding: 15px; background-color: var(--panel-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: center; gap: 10px; }
        button { padding: 10px 24px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-main { background-color: var(--btn-primary); color: white; flex: 1; max-width: 300px; justify-content: center; }
        .btn-main:hover { background-color: var(--btn-primary-hover); }
        .btn-secondary { background-color: #21262d; color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background-color: #30363d; }
        .status-bar { padding: 8px; text-align: center; font-size: 13px; font-weight: 500; color: #e3b341; background-color: var(--bg-color); border-top: 1px solid var(--border-color); }
        @media (max-width: 768px) { .container { flex-direction: column; } .panel { min-height: 250px; } }
    </style>
</head>
<body>
    <header>
        <h1>🛡️ <span>Ultimate</span> JS Deobfuscator</h1>
        <div style="font-size: 12px; color: var(--text-muted);">v4.0 Super</div>
    </header>

    <div class="container">
        <div class="panel">
            <div class="panel-header"><span>Obfuscated Code (Input)</span></div>
            <textarea id="inputCode" placeholder="Paste FULL code here (Start from line 1)..."></textarea>
        </div>
        <div class="panel">
            <div class="panel-header">
                <span>Clean JavaScript (Output)</span>
                <span id="copyBtn" style="cursor: pointer; color: var(--accent);">📋 Copy Code</span>
            </div>
            <textarea id="outputCode" readonly placeholder="Decoded code will appear here..."></textarea>
        </div>
    </div>

    <div class="controls">
        <button class="btn-secondary" onclick="clearAll()">Clear</button>
        <button class="btn-main" onclick="runDeobfuscator()">🚀 Deobfuscate Code</button>
    </div>

    <div class="status-bar" id="status">Ready to process...</div>

    <script>
        function setStatus(msg, isError = false) {
            const el = document.getElementById('status');
            el.innerText = msg;
            el.style.color = isError ? 'var(--danger)' : '#e3b341';
        }

        function customDecode(str, alphabet) {
            const bytes = [];
            let acc = 0, shift = 0, prev = -1;
            for (let i = 0; i < str.length; i++) {
                const idx = alphabet.indexOf(str[i]);
                if (idx === -1) continue;
                if (prev < 0) prev = idx;
                else {
                    prev += idx * 0x5b;
                    acc |= prev << shift;
                    shift += (prev & 0x1fff) > 0x58 ? 0xd : 0xe;
                    do { bytes.push(acc & 0xff); acc >>= 8; shift -= 8; } while (shift > 7);
                    prev = -1;
                }
            }
            if (prev > -1) bytes.push((acc | prev << shift) & 0xff);
            const text = new TextDecoder("utf-8").decode(new Uint8Array(bytes));
            if (text.includes('\uFFFD')) return null; 
            return text;
        }

        function decodeCustomBase(code) {
            try {
                // 1. Saari string values nikaalo (Unicode names ko support karte hue)
                const strRegex = /var\s+[^\s=]+\s*=\s*"((?:[^"\\]|\\.)*)"/g;
                let match; const allStrings = [];
                while ((match = strRegex.exec(code)) !== null) {
                    try { allStrings.push(JSON.parse('"' + match[1] + '"')); } catch(e) {}
                }
                if (allStrings.length === 0) return code;

                // 2. Sabse lamba string (Data)
                const OF = [...allStrings].sort((a, b) => b.length - a.length)[0];
                if (!OF || OF.length < 100) return code;

                // 3. Saare alphabets dhoondo (90 characters ke aas-paas)
                let alphabets = allStrings.filter(s => s.length >= 80 && s.length <= 100);
                if (alphabets.length === 0) return code;

                // 4. Calls ko replace karo (Unicode variable names jaise inтАМ(0x...))
                code = code.replace(/[^\s\(\)\{\}\;=]+\(\s*0x([0-9a-f]+)\s*,\s*0x([0-9a-f]+)\s*\)/gi, (match, p1, p2) => {
                    const off = parseInt(p1, 16);
                    const len = parseInt(p2, 16);
                    try {
                        const slice = OF.slice(off, off + len);
                        if(!slice) return match;
                        for (const alpha of alphabets) {
                            const decoded = customDecode(slice, alpha);
                            if (decoded && /^[\x20-\x7E\s]*$/.test(decoded) && decoded.length > 0) {
                                return JSON.stringify(decoded);
                            }
                        }
                    } catch (e) {}
                    return match;
                });
            } catch(e) { console.log("Error:", e); }
            return code;
        }

        function runDeobfuscator() {
            let code = document.getElementById('inputCode').value;
            if (!code.trim()) return setStatus("⚠️ Please paste some code first!", true);

            setStatus("⏳ Decoding... (Thoda time lag sakta hai)");
            
            // Thoda delay taaki UI update ho jaye
            setTimeout(() => {
                code = decodeCustomBase(code);

                setStatus("⏳ Beautifying...");
                try {
                    code = js_beautify(code, { indent_size: 2, space_in_empty_paren: true });
                } catch (e) {}

                document.getElementById('outputCode').value = code;
                setStatus("✅ Success! Code Cleaned.");
            }, 100);
        }

        document.getElementById('copyBtn').addEventListener('click', () => {
            const out = document.getElementById('outputCode');
            if (!out.value) return;
            out.select(); out.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(out.value).then(() => {
                setStatus("📋 Copied!");
                setTimeout(() => setStatus("Ready..."), 2000);
            });
        });

        function clearAll() {
            document.getElementById('inputCode').value = '';
            document.getElementById('outputCode').value = '';
        }
    </script>
</body>
</html>
